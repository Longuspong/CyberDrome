# Baut das Spiel als PWA (Godot-Web-Export ohne Threads) und veroeffentlicht
# es auf GitHub Pages.
#
#   * Pull Request: nur bauen -- prueft, dass der Export durchlaeuft. Das
#     Ergebnis liegt als Artefakt "github-pages" am Lauf.
#   * Push auf main / manuell: bauen UND veroeffentlichen.
#
# Einmalig im Repo einstellen: Settings -> Pages -> Source: "GitHub Actions".
#
# Gebaut wird mit tools/build_web.sh -- demselben Skript, das Vercel benutzt
# (vercel.json). Version und Pruefsumme stehen dort.

name: Web-Build (PWA)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Web-Export bauen (dasselbe Skript wie auf Vercel)
        run: bash tools/build_web.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
