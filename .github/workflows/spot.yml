# Prueft, dass die SPOT-Tabelle (docs/spot/CyberDrome_SPOT.xlsx) zu den
# Spieldaten passt. Rot heisst: python3 tools/build_spot.py ausfuehren und
# die neue Tabelle einchecken.

name: SPOT-Tabelle aktuell

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python3 tools/build_spot.py --check
