# Prueft, dass die SPOT-Tabellen (docs/spot/CyberDrome_SPOT_*.xlsx) zu den
# Spieldaten passen. Rot heisst: python3 tools/build_spot.py ausfuehren und
# die neuen Tabellen einchecken.

name: SPOT-Tabelle aktuell

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python3 tools/build_spot.py --check
      # Hindernis-Modelle der 3D-Kampfszene (18. Nov. 2026): Rot heisst
      # python3 tools/build_arena_models.py ausfuehren und assets/arena3d einchecken.
      - run: python3 tools/build_arena_models.py --check
