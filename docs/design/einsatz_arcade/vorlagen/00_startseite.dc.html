<script type="text/x-dc" data-dc-script="" data-props="{&quot;credits&quot;:{&quot;editor&quot;:&quot;number&quot;,&quot;default&quot;:240},&quot;coins&quot;:{&quot;editor&quot;:&quot;number&quot;,&quot;default&quot;:1850},&quot;$preview&quot;:{&quot;width&quot;:450,&quot;height&quot;:800}}">
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { toast: '' };
}
renderVals() {
const fmt = (n) => Number(n).toLocaleString('de-DE');
return {
credits: fmt(this.props.credits ?? 240),
coins: fmt(this.props.coins ?? 1850),
toast: this.state.toast,
start: () => this.setState({ toast: 'EINSATZ STARTET · NEON CITY' }),
endless: () => this.setState({ toast: 'GESPERRT · ERST NEON CITY BEZWINGEN' }),
toHangar: () => this.setState({ toast: 'HANGAR · FOLGT' }),
toOptions: () => this.setState({ toast: 'OPTIONEN · FOLGT' })
};
}
}
</script>
