    Erzeugt von tools/build_sample_parts.py aus einer bot-lokalen Quader-
    Definition, nicht von Hand bearbeiten, sondern dort aendern.
    Farben ausschliesslich ueber CSS Custom Properties (siehe parts/README.md).
  -->
